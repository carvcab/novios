name: iOS Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pods
        run: |
          cd "iphone app"
          pod install --repo-update

      - name: Build Archive
        run: |
          cd "iphone app"
          xcodebuild archive \
            -workspace Novios.xcworkspace \
            -scheme Novios \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build_output/Novios.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (unsigned)
        run: |
          cd "iphone app"
          mkdir -p build_output/ipa
          APP_PATH="build_output/Novios.xcarchive/Products/Applications/Novios.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p build_output/Payload
            cp -R "$APP_PATH" build_output/Payload/
            cd build_output
            zip -r ipa/Novios.ipa Payload
          else
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Novios-iOS-Debug
          path: iphone app/build_output/ipa/Novios.ipa
