name: iOS Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pods
        run: |
          cd "iphone app"
          pod install --repo-update

      - name: Build Archive
        run: |
          cd "iphone app"
          xcodebuild archive \
            -workspace Novios.xcworkspace \
            -scheme Novios \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build_output/Novios.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (unsigned)
        run: |
          cd "iphone app"
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF
          # For unsigned Debug export we just zip the app bundle directly
          mkdir -p build_output/ipa
          APP_PATH="build_output/Novios.xcarchive/Products/Applications/Novios.app"
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "${GITHUB_WORKSPACE}/iphone app/build_output/ipa/Novios.ipa" "Novios.app"
          else
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Novios-iOS-Debug
          path: iphone app/build_output/ipa/Novios.ipa
