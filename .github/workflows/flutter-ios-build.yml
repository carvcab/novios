name: Flutter iOS Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Identificador único del build'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Flutter
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build iOS App (No Signing)
        run: |
          flutter build ios --no-codesign --debug --target-platform ios-arm64

      - name: Package IPA
        run: |
          BUILD_DIR="build/ios/Debug-iphoneos"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR="build/ios/iphoneos"
          fi
          cd "$BUILD_DIR"
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "${{ inputs.build_id }}.ipa" Payload
          mkdir -p "${GITHUB_WORKSPACE}/ipa-flutter"
          cp "${{ inputs.build_id }}.ipa" "${GITHUB_WORKSPACE}/ipa-flutter/"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-flutter
          path: ipa-flutter/*.ipa
          retention-days: 30
